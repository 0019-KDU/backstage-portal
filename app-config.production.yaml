# Production overrides, loaded on top of app-config.yaml:
#   node packages/backend --config app-config.yaml --config app-config.production.yaml
#
# No secrets in this file. Every ${VAR} is injected at runtime from
# /etc/backstage/backstage.env (see deploy/README.md).

app:
  # Public URL served by Nginx (TLS terminated there). Same as backend.baseUrl
  # because the app-backend plugin serves the frontend bundle.
  baseUrl: ${BACKSTAGE_BASE_URL}

backend:
  baseUrl: ${BACKSTAGE_BASE_URL}
  # Bind to loopback only; Nginx on the same host is the only public entrypoint.
  # The container uses host networking, so this is the host's 127.0.0.1.
  listen:
    host: 127.0.0.1
    port: 7007
  # Nginx proxies from 127.0.0.1; trust its X-Forwarded-* headers only.
  trustProxy: loopback
  cors:
    origin: ${BACKSTAGE_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    # One database, one schema per plugin. Only needs CREATE on POSTGRES_DB
    # (no CREATEDB role attribute) and keeps backups to a single pg_dump.
    pluginDivisionMode: schema
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}
      # https://node-postgres.com/features/ssl
      # PostgreSQL is on loopback here; enable ssl when moving to RDS.
      # ssl:
      #   ca:
      #     $file: /path/to/rds-global-bundle.pem

auth:
  # Selects the `production` block under each provider below.
  environment: production
  providers:
    # Explicitly unset the dev-only guest provider inherited from app-config.yaml.
    guest: null
    # https://backstage.io/docs/auth/github/provider
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        sessionDuration: { hours: 12 }
        signIn:
          resolvers:
            # Matches the GitHub account's node ID to the `github.com/user-id`
            # annotation on a User entity (see catalog/users.yaml). Users that
            # are not in the catalog are rejected.
            - resolver: userIdMatchingUserEntityAnnotation

catalog:
  # Overrides the default list locations from app-config.yaml as these contain example data.
  # File locations are relative to the backend process working dir (/app in the container).
  locations:
    # Local example data, replace this with your production config, these are intended for demo use only.
    - type: file
      target: ./examples/entities.yaml

    # Local example template
    - type: file
      target: ./examples/template/template.yaml
      rules:
        - allow: [Template]

    # Users/groups allowed to sign in via GitHub.
    - type: file
      target: ./catalog/users.yaml
      rules:
        - allow: [User, Group]

    # Systems (logical groupings of services)
    - type: file
      target: ./catalog/systems.yaml
      rules:
        - allow: [System]

    # Golden-path templates, read live from GitHub (edit + push = updated template, no rebuild)
    - type: url
      target: https://github.com/0019-KDU/idp-platform/blob/main/templates/ecs-nodejs-service/template.yaml
      rules:
        - allow: [Template]

    # Existing services (services created by the template register themselves)
    - type: url
      target: https://github.com/0019-KDU/reference-api/blob/main/catalog-info.yaml

# TechDocs: build in the container (no Docker available inside it) and publish to the
# writable tmpfs (/tmp); docs are rebuilt on demand after a restart.
# Production target: build in CI and publish to S3 (awsS3 publisher).
techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'
    local:
      publishDirectory: /tmp/techdocs
