# Production overrides, loaded on top of app-config.yaml:
#   node packages/backend --config app-config.yaml --config app-config.production.yaml
#
# No secrets in this file. Every ${VAR} is injected at runtime from
# /etc/backstage/backstage.env (see deploy/README.md).

app:
  # Public URL served by Nginx (TLS terminated there). Same as backend.baseUrl
  # because the app-backend plugin serves the frontend bundle.
  baseUrl: ${BACKSTAGE_BASE_URL}

backend:
  baseUrl: ${BACKSTAGE_BASE_URL}
  # Bind to loopback only; Nginx on the same host is the only public entrypoint.
  # The container uses host networking, so this is the host's 127.0.0.1.
  listen:
    host: 127.0.0.1
    port: 7007
  # Nginx proxies from 127.0.0.1; trust its X-Forwarded-* headers only.
  trustProxy: loopback
  cors:
    origin: ${BACKSTAGE_BASE_URL}
    methods: [GET, HEAD, PATCH, POST, PUT, DELETE]
    credentials: true

  # config options: https://node-postgres.com/apis/client
  database:
    client: pg
    # One database, one schema per plugin. Only needs CREATE on POSTGRES_DB
    # (no CREATEDB role attribute) and keeps backups to a single pg_dump.
    pluginDivisionMode: schema
    connection:
      host: ${POSTGRES_HOST}
      port: ${POSTGRES_PORT}
      user: ${POSTGRES_USER}
      password: ${POSTGRES_PASSWORD}
      database: ${POSTGRES_DB}
      # https://node-postgres.com/features/ssl
      # PostgreSQL is on loopback here; enable ssl when moving to RDS.
      # ssl:
      #   ca:
      #     $file: /path/to/rds-global-bundle.pem

auth:
  # Selects the `production` block under each provider below.
  environment: production
  providers:
    # Explicitly unset the dev-only guest provider inherited from app-config.yaml.
    guest: null
    # https://backstage.io/docs/auth/github/provider
    github:
      production:
        clientId: ${AUTH_GITHUB_CLIENT_ID}
        clientSecret: ${AUTH_GITHUB_CLIENT_SECRET}
        sessionDuration: { hours: 12 }
        signIn:
          resolvers:
            # Matches the GitHub account's node ID to the `github.com/user-id`
            # annotation on a User entity (see catalog/users.yaml). Users that
            # are not in the catalog are rejected.
            - resolver: userIdMatchingUserEntityAnnotation

catalog:
  # Overrides the default list locations from app-config.yaml as these contain example data.
  # File locations are relative to the backend process working dir (/app in the container).
  # Only real platform data in production (Backstage's example entities are dev-only).
  locations:
    # Users/groups allowed to sign in via GitHub.
    - type: file
      target: ./catalog/users.yaml
      rules:
        - allow: [User, Group]

    # Systems (logical groupings of services)
    - type: file
      target: ./catalog/systems.yaml
      rules:
        - allow: [System]

    # Golden-path + self-service templates, read live from GitHub via one index file
    # (edit/add a template + push = updated in Backstage, no rebuild)
    - type: url
      target: https://github.com/0019-KDU/idp-platform/blob/main/templates/all-templates.yaml
      rules:
        - allow: [Location, Template]

    # Self-service cloud resources (RDS, S3, EC2): discovered after their PR is merged
    - type: url
      target: https://github.com/0019-KDU/platform-resources/blob/main/resources/*/*/catalog-info.yaml
      rules:
        - allow: [Resource]

    # Existing services (services created by the template register themselves)
    - type: url
      target: https://github.com/0019-KDU/reference-api/blob/main/catalog-info.yaml

# TechDocs: build in the container (no Docker available inside it) on first view and
# publish to a persistent Docker volume, so built docs survive container restarts
# (rebuilt only when the docs change). Production target: build in CI, publish to S3.
techdocs:
  builder: 'local'
  generator:
    runIn: 'local'
  publisher:
    type: 'local'
    local:
      publishDirectory: /app/techdocs-site

# Cost Insights (page /cost-insights + "Costs" tab on catalog entities).
# Data: AWS Cost Explorer via @aws/cost-insights-plugin-for-backstage-backend, using the
# EC2 instance role (ce:GetCostAndUsage). Entities choose their costs with the annotation
#   aws.amazon.com/cost-insights-tags: <tag>=<value>[,<tag>=<value>]
# Tags must be ACTIVATED as cost allocation tags in AWS Billing (owner, component, project, ...).
costInsights:
  # Yearly cost of one engineer (USD): Cost Insights expresses savings/overspend in engineer terms
  engineerCost: 60000

aws:
  costInsights:
    costExplorer:
      accountId: '697502032879'
      region: us-east-1 # Cost Explorer's API endpoint is global, served from us-east-1
      costMetric: UnblendedCost
    cache:
      enable: true
      # 6h: Cost Explorer charges $0.01 per request and updates a few times a day.
      # Kept short on purpose: the plugin also caches ERROR responses (e.g. an entity
      # queried before its annotation was loaded), so a bad entry heals within 6h.
      defaultTtl: 21600000
    entityGroups:
      # Team page: cost per service the team owns, and per AWS product (ECS, RDS, ...)
      - kind: Group
        groups:
          - name: service
            type: TAG
            key: component
          - name: aws-product
            type: DIMENSION
            key: SERVICE
      # Service page: per AWS product and per environment
      - kind: Component
        groups:
          - name: aws-product
            type: DIMENSION
            key: SERVICE
          - name: environment
            type: TAG
            key: environment
      # Whole platform (System): per team and per service
      - kind: System
        groups:
          - name: team
            type: TAG
            key: owner
          - name: service
            type: TAG
            key: component
      - kind: Resource
        groups:
          - name: aws-product
            type: DIMENSION
            key: SERVICE
