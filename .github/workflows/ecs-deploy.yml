# =============================================================================
# DevOps94 IDP — deploy ONE environment (called by ecs-service.yml)
#
# Runs in the GitHub Environment <environment>:
#   - dev / staging: no approval
#   - prod: required reviewers (the job waits for the approval button)
# and assumes that environment's AWS role (devops94-idp-<env>-deploy), which can
# only be assumed from that GitHub Environment and only changes that environment.
# =============================================================================
name: ecs-deploy

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      environment:
        description: "dev | staging | prod"
        required: true
        type: string
      image-tag:
        description: "Image built once by the pipeline (sha-<commit>)"
        required: true
        type: string
      aws-account-id:
        type: string
        default: "697502032879"
      aws-region:
        type: string
        default: ap-south-1
      terraform-version:
        type: string
        default: 1.16.3
    outputs:
      url:
        value: ${{ jobs.deploy.outputs.url }}

jobs:
  deploy:
    name: Deploy ${{ inputs.environment }}
    runs-on: ubuntu-latest
    timeout-minutes: 60 # first deploy creates the database (~10 min); prod bake time is 10 min
    environment:
      name: ${{ inputs.environment }}
      url: ${{ steps.smoke.outputs.url }}
    concurrency:
      group: deploy-${{ inputs.service-name }}-${{ inputs.environment }}
      cancel-in-progress: false # never interrupt a running terraform apply / deployment
    permissions:
      contents: read
      id-token: write
    outputs:
      url: ${{ steps.smoke.outputs.url }}
    defaults:
      run:
        working-directory: infra/app
    env:
      SERVICE: ${{ inputs.service-name }}
      ENVIRONMENT: ${{ inputs.environment }}
      IMAGE_TAG: ${{ inputs.image-tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Log in to AWS as the ${{ inputs.environment }} deploy role (OIDC, no stored keys)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/devops94-idp-${{ inputs.environment }}-deploy
          aws-region: ${{ inputs.aws-region }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Terraform init (state services/<service>/<environment>.tfstate)
        run: terraform init -input=false -backend-config="key=services/${SERVICE}/${ENVIRONMENT}.tfstate"

      - name: Terraform plan
        run: terraform plan -input=false -no-color -var-file="env/${ENVIRONMENT}.tfvars" -var "image_tag=${IMAGE_TAG}" -out=tf.plan

      - name: Deploy (waits until ECS reports the deployment healthy; blue/green includes the bake time)
        run: terraform apply -input=false -no-color tf.plan

      - name: Smoke test through the load balancer
        id: smoke
        run: |
          URL="$(terraform output -raw url)"
          echo "url=${URL}" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 24); do
            if curl -fsS "${URL}health"; then echo; break; fi
            [ "$i" = 24 ] && { echo "::error::health check failed"; exit 1; }
            sleep 5
          done
          BODY="$(curl -fsS "${URL}")"; echo "$BODY"
          echo "$BODY" | grep -q "\"version\":\"${IMAGE_TAG}\"" || { echo "::error::expected version ${IMAGE_TAG}"; exit 1; }
          {
            echo "### :rocket: ${SERVICE} → **${ENVIRONMENT}** ($(terraform output -raw deployment_strategy))"
            echo "- Image: \`${IMAGE_TAG}\`"
            echo "- URL: ${URL}"
          } >> "$GITHUB_STEP_SUMMARY"
