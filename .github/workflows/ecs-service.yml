# =============================================================================
# DevOps94 IDP — reusable golden-path pipeline for a service on ECS Fargate
#
#   test ─┐                                     (pull requests stop here)
#   scan ─┴─► build ONCE ─► dev ─► staging ─► prod
#             ECR, scanned   rolling  blue/green  approval + blue/green
#
# The same image (sha-<commit>) is promoted; it is never rebuilt per environment.
#
# Usage (service repo, .github/workflows/ci-cd.yml):
#   on: { push: { branches: [main] }, pull_request: {} }
#   permissions: { contents: read, id-token: write }
#   jobs:
#     pipeline:
#       uses: 0019-KDU/idp-platform/.github/workflows/ecs-service.yml@main
#       with: { service-name: my-service, language: node, postgres: true }
#
# Service repo contract: infra/shared (ECR repo, output repository_url),
# infra/app (+ env/<env>.tfvars; outputs url, deployment_strategy).
# =============================================================================
name: ecs-service pipeline

on:
  workflow_call:
    inputs:
      service-name:
        required: true
        type: string
      language:
        description: "node | python"
        type: string
        default: node
      test-command:
        description: "Overrides the default test command (node: npm test, python: python -m pytest -q)"
        type: string
        default: ""
      postgres:
        description: "Start a PostgreSQL 17 service container for the tests (DB_* env vars are set)"
        type: boolean
        default: false
      node-version:
        type: string
        default: "24"
      python-version:
        type: string
        default: "3.13"
      enable-staging:
        type: boolean
        default: true
      enable-prod:
        type: boolean
        default: true
      aws-account-id:
        type: string
        default: "697502032879"
      aws-region:
        type: string
        default: ap-south-1
      terraform-version:
        type: string
        default: 1.16.3

env:
  TRIVY_VERSION: 0.74.0
  GITLEAKS_VERSION: 8.30.1

jobs:
  # ---------------------------------------------------------------------------
  test:
    name: Tests
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        # empty image = no service container
        image: ${{ inputs.postgres && 'postgres:17-alpine' || '' }}
        env:
          POSTGRES_USER: app
          POSTGRES_PASSWORD: app
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U app"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      DB_HOST: localhost
      DB_PORT: "5432"
      DB_NAME: app
      DB_USER: app
      DB_PASSWORD: app
      DB_SSL: "false"
      LANGUAGE: ${{ inputs.language }}
      TEST_COMMAND: ${{ inputs.test-command }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        if: inputs.language == 'node'
        with:
          node-version: ${{ inputs.node-version }}

      - uses: actions/setup-python@v7
        if: inputs.language == 'python'
        with:
          python-version: ${{ inputs.python-version }}
          cache: pip

      - name: Install dependencies
        run: |
          case "$LANGUAGE" in
            node)   if [ -f package-lock.json ]; then npm ci; else echo "no package-lock.json"; fi ;;
            python) pip install -r requirements.txt -r requirements-dev.txt ;;
            *)      echo "::error::unsupported language '$LANGUAGE' (use node or python)"; exit 1 ;;
          esac

      - name: Run tests
        run: |
          if [ -n "$TEST_COMMAND" ]; then eval "$TEST_COMMAND"; exit $?; fi
          case "$LANGUAGE" in
            node)   npm test ;;
            python) python -m pytest -q ;;
          esac

  # ---------------------------------------------------------------------------
  scan:
    name: Security scan (secrets, dependencies, IaC)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Gitleaks, secrets in git history (blocking)
        run: |
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | tar -xz gitleaks
          ./gitleaks git --redact --no-banner --verbose .

      - name: Trivy, vulnerable dependencies + secrets in files (blocking on HIGH/CRITICAL with a fix)
        run: |
          docker run --rm -v "$PWD:/src" "aquasec/trivy:${TRIVY_VERSION}" fs \
            --scanners vuln,secret --severity HIGH,CRITICAL --ignore-unfixed \
            --exit-code 1 --no-progress /src

      - name: Trivy, Dockerfile + Terraform misconfigurations (report only)
        run: |
          docker run --rm -v "$PWD:/src" "aquasec/trivy:${TRIVY_VERSION}" config \
            --severity MEDIUM,HIGH,CRITICAL --exit-code 0 /src

  # ---------------------------------------------------------------------------
  build:
    name: Build once, scan, push to ECR
    needs: [test, scan]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # OIDC -> devops94-idp-build (main branch only, ECR only)
    outputs:
      tag: ${{ steps.build.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: arn:aws:iam::${{ inputs.aws-account-id }}:role/devops94-idp-build
          aws-region: ${{ inputs.aws-region }}

      - uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: ${{ inputs.terraform-version }}
          terraform_wrapper: false

      - name: Ensure the image repository (infra/shared)
        working-directory: infra/shared
        run: |
          terraform init -input=false
          terraform apply -input=false -auto-approve -no-color

      - uses: aws-actions/amazon-ecr-login@v2

      - name: Build image
        id: build
        run: |
          TAG="sha-${GITHUB_SHA::7}"
          REPO="$(terraform -chdir=infra/shared output -raw repository_url)"
          docker build --provenance=false --sbom=false \
            --label org.opencontainers.image.revision="${GITHUB_SHA}" \
            --label org.opencontainers.image.source="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            -t "${REPO}:${TAG}" .
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "image=${REPO}:${TAG}" >> "$GITHUB_OUTPUT"

      - name: Trivy, scan the built image (blocking on CRITICAL with a fix)
        run: |
          docker run --rm -v /var/run/docker.sock:/var/run/docker.sock "aquasec/trivy:${TRIVY_VERSION}" image \
            --severity CRITICAL --ignore-unfixed --exit-code 1 --no-progress "${{ steps.build.outputs.image }}"

      - name: Push (immutable tags; skip if this commit was already pushed)
        run: |
          REPO_NAME="devops94-idp-svc-${{ inputs.service-name }}"
          if aws ecr describe-images --repository-name "$REPO_NAME" --image-ids imageTag="${{ steps.build.outputs.tag }}" >/dev/null 2>&1; then
            echo "already in ECR"
          else
            docker push "${{ steps.build.outputs.image }}"
          fi

  # ---------------------------------------------------------------------------
  dev:
    needs: build
    uses: 0019-KDU/idp-platform/.github/workflows/ecs-deploy.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      service-name: ${{ inputs.service-name }}
      environment: dev
      image-tag: ${{ needs.build.outputs.tag }}
      aws-account-id: ${{ inputs.aws-account-id }}
      aws-region: ${{ inputs.aws-region }}
      terraform-version: ${{ inputs.terraform-version }}

  staging:
    needs: [build, dev]
    if: inputs.enable-staging
    uses: 0019-KDU/idp-platform/.github/workflows/ecs-deploy.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      service-name: ${{ inputs.service-name }}
      environment: staging
      image-tag: ${{ needs.build.outputs.tag }}
      aws-account-id: ${{ inputs.aws-account-id }}
      aws-region: ${{ inputs.aws-region }}
      terraform-version: ${{ inputs.terraform-version }}

  prod:
    needs: [build, staging]
    if: inputs.enable-prod
    uses: 0019-KDU/idp-platform/.github/workflows/ecs-deploy.yml@main
    permissions:
      contents: read
      id-token: write
    with:
      service-name: ${{ inputs.service-name }}
      environment: prod # GitHub Environment with required reviewers = approval button
      image-tag: ${{ needs.build.outputs.tag }}
      aws-account-id: ${{ inputs.aws-account-id }}
      aws-region: ${{ inputs.aws-region }}
      terraform-version: ${{ inputs.terraform-version }}
