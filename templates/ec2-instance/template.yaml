apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-ec2-instance
  title: EC2 instance (Amazon Linux)
  description: >-
    Small Amazon Linux 2023 server with no SSH and no open ports; open a browser shell
    through AWS Systems Manager. Encrypted disk, IMDSv2. Opens a pull request: created
    after platform-team approval.
  tags: [aws, ec2, server, self-service]
spec:
  owner: group:default/platform-admins
  type: resource
  parameters:
    - title: Server
      required: [name, description, owner]
      properties:
        name:
          title: Name
          type: string
          description: Lowercase letters, digits and dashes (3–22 characters).
          pattern: '^[a-z][a-z0-9-]{1,20}[a-z0-9]$'
          ui:autofocus: true
          ui:help: 'Example: build-runner'
        description:
          title: Purpose
          type: string
          description: One sentence, shown in the catalog and on the pull request.
          maxLength: 120
        owner:
          title: Owner team
          type: string
          description: Team responsible for this resource (cost, access, lifecycle).
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        environment:
          title: Environment
          type: string
          description: Which environment's private network the resource lives in.
          default: dev
          enum: [dev, staging, prod]
        component:
          title: Used by service (optional)
          type: string
          description: Links the resource to a service in the catalog.
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Component
    - title: Size
      properties:
        instanceType:
          title: Size (approx. monthly cost if always on, ap-south-1)
          type: string
          default: t3.micro
          enum: [t3.micro, t3.small, t3.medium]
          enumNames:
            - 'Small: t3.micro, 2 vCPU burst, 1 GiB (~$8/month)'
            - 'Medium: t3.small, 2 vCPU burst, 2 GiB (~$16/month)'
            - 'Large: t3.medium, 2 vCPU burst, 4 GiB (~$33/month)'
        rootVolume:
          title: Disk (GiB)
          type: integer
          default: 20
          enum: [20, 50, 100]
  steps:
    - id: fetch
      name: Generate Terraform from the approved module
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: resource-pr/resources/ec2-instance/${{ parameters.environment }}/${{ parameters.name }}
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          component: ${{ parameters.component }}
          requester: ${{ user.entityRef }}
          type: ec2-instance
          environment: ${{ parameters.environment }}
          instanceType: ${{ parameters.instanceType }}
          rootVolume: ${{ parameters.rootVolume }}
    - id: pr
      name: Open a pull request for review
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=0019-KDU&repo=platform-resources
        branchName: request/ec2-instance-${{ parameters.environment }}-${{ parameters.name }}
        sourcePath: resource-pr
        title: 'Request: EC2 instance "${{ parameters.name }}"'
        commitMessage: 'Request EC2 instance ${{ parameters.name }} (via Backstage)'
        description: |
          ## EC2 instance request

          | | |
          |---|---|
          | Name | `${{ parameters.name }}` |
          | Purpose | ${{ parameters.description }} |
          | Environment | `${{ parameters.environment }}` |
          | Owner | `${{ parameters.owner }}` |
          | Used by | `${{ parameters.component or '-' }}` |
          | Requested by | `${{ user.entityRef }}` |
          | Size | `${{ parameters.instanceType }}`, `${{ parameters.rootVolume }}` GiB disk |

          **Next:** the pipeline posts the `terraform plan` below as a comment.
          The platform team reviews it; **merging creates the resource in AWS**.
  output:
    links:
      - title: Pull request (plan + review; merge to create)
        url: ${{ steps.pr.output.remoteUrl }}
    text:
      - title: What happens next
        content: |
          1. The pipeline runs `terraform plan` and comments it on the pull request (1–2 min).
          2. The platform team reviews and merges.
          3. The resource is created in AWS and appears in the catalog.
