apiVersion: scaffolder.backstage.io/v1beta3
kind: Template
metadata:
  name: aws-rds-postgres
  title: PostgreSQL database (AWS RDS)
  description: >-
    Private, encrypted PostgreSQL with automated backups. Only ECS services can connect;
    the password is generated and kept in AWS Secrets Manager. Opens a pull request:
    created after platform-team approval (about 10 minutes after merge).
  tags: [aws, rds, database, self-service]
spec:
  owner: group:default/platform-admins
  type: resource
  parameters:
    - title: Database
      required: [name, description, owner]
      properties:
        name:
          title: Name
          type: string
          description: Lowercase letters, digits and dashes (3–22 characters).
          pattern: '^[a-z][a-z0-9-]{1,20}[a-z0-9]$'
          ui:autofocus: true
          ui:help: 'Example: orders-db'
        description:
          title: Purpose
          type: string
          description: One sentence, shown in the catalog and on the pull request.
          maxLength: 120
        owner:
          title: Owner team
          type: string
          description: Team responsible for this resource (cost, access, lifecycle).
          ui:field: OwnerPicker
          ui:options:
            catalogFilter:
              kind: Group
        environment:
          title: Environment
          type: string
          description: Which environment's private network the resource lives in.
          default: dev
          enum: [dev, staging, prod]
        connect:
          title: Connect to the service
          type: boolean
          default: true
          description: >-
            Also open a pull request in the selected service's repository that gives the
            service access (and environment variables) in this environment.
        component:
          title: Used by service (optional)
          type: string
          description: Links the resource to a service in the catalog.
          ui:field: EntityPicker
          ui:options:
            catalogFilter:
              kind: Component
    - title: Size
      properties:
        instanceClass:
          title: Size (approx. monthly cost, ap-south-1)
          type: string
          default: db.t4g.micro
          enum: [db.t4g.micro, db.t4g.small, db.t4g.medium]
          enumNames:
            - 'Small: db.t4g.micro, 1 GiB RAM (~$13/month)'
            - 'Medium: db.t4g.small, 2 GiB RAM (~$26/month)'
            - 'Large: db.t4g.medium, 4 GiB RAM (~$52/month)'
        storage:
          title: Storage (GiB, ~$0.13 per GiB-month)
          type: integer
          default: 20
          enum: [20, 50, 100]
  steps:
    - id: fetch
      name: Generate Terraform from the approved module
      action: fetch:template
      input:
        url: ./skeleton
        targetPath: resource-pr/resources/rds-postgres/${{ parameters.environment }}/${{ parameters.name }}
        values:
          name: ${{ parameters.name }}
          description: ${{ parameters.description }}
          owner: ${{ parameters.owner }}
          component: ${{ parameters.component }}
          requester: ${{ user.entityRef }}
          type: rds-postgres
          environment: ${{ parameters.environment }}
          instanceClass: ${{ parameters.instanceClass }}
          storage: ${{ parameters.storage }}
    - id: pr
      name: Open a pull request for review
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=0019-KDU&repo=platform-resources
        branchName: request/rds-postgres-${{ parameters.environment }}-${{ parameters.name }}
        sourcePath: resource-pr
        title: 'Request: PostgreSQL database "${{ parameters.name }}"'
        commitMessage: 'Request PostgreSQL database ${{ parameters.name }} (via Backstage)'
        description: |
          ## PostgreSQL database request

          | | |
          |---|---|
          | Name | `${{ parameters.name }}` |
          | Purpose | ${{ parameters.description }} |
          | Environment | `${{ parameters.environment }}` |
          | Owner | `${{ parameters.owner }}` |
          | Used by | `${{ parameters.component or '-' }}` |
          | Requested by | `${{ user.entityRef }}` |
          | Size | `${{ parameters.instanceClass }}`, `${{ parameters.storage }}` GiB |

          **Next:** the pipeline posts the `terraform plan` below as a comment.
          The platform team reviews it; **merging creates the resource in AWS**.
    - id: binding
      name: Generate the service binding
      if: ${{ parameters.connect and parameters.component }}
      action: fetch:template
      input:
        url: ./binding
        targetPath: service-pr/infra/app/bindings/${{ parameters.environment }}
        values:
          name: ${{ parameters.name }}
          access: ${{ parameters.access or 'read-write' }}
          envPrefix: ${{ parameters.name | upper | replace('-', '_') }}

    - id: connect
      name: Open a pull request in the service repository
      if: ${{ parameters.connect and parameters.component }}
      action: publish:github:pull-request
      input:
        repoUrl: github.com?owner=0019-KDU&repo=${{ parameters.component | parseEntityRef | pick('name') }}
        branchName: connect/rds-postgres-${{ parameters.environment }}-${{ parameters.name }}
        sourcePath: service-pr
        title: 'Connect rds-postgres "${{ parameters.name }}" (${{ parameters.environment }})'
        commitMessage: 'Bind rds-postgres ${{ parameters.name }} in ${{ parameters.environment }} (via Backstage)'
        description: |
          Gives this service access to **rds-postgres `${{ parameters.name }}`** in **${{ parameters.environment }}**
          (binding file `infra/app/bindings/${{ parameters.environment }}/`).

          Environment variables: prefix `${{ parameters.name | upper | replace('-', '_') }}_`.

          **Merge after** the resource request in `platform-resources` has been merged and applied.

  output:
    links:
      - title: 1. Resource request (plan + review; merge to create)
        url: ${{ steps.pr.output.remoteUrl }}
      - title: 2. Service access (merge after 1 is applied)
        if: ${{ parameters.connect and parameters.component }}
        url: ${{ steps.connect.output.remoteUrl }}
    text:
      - title: What happens next
        content: |
          1. The pipeline runs `terraform plan` and comments it on the pull request (1–2 min).
          2. The platform team reviews and merges.
          3. The resource is created in AWS and appears in the catalog.
