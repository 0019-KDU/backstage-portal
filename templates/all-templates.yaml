# Index of all DevOps94 IDP templates. Backstage reads this one file from GitHub;
# adding a template = add a target here and push (no Backstage rebuild).
apiVersion: backstage.io/v1alpha1
kind: Location
metadata:
  name: devops94-idp-templates
  description: DevOps94 IDP golden paths and self-service resources
spec:
  targets:
    - ./ecs-nestjs-service/template.yaml
    - ./ecs-nodejs-service/template.yaml
    - ./ecs-python-service/template.yaml
    - ./rds-postgres/template.yaml
    - ./s3-bucket/template.yaml
    - ./ec2-instance/template.yaml
