# Backstage catalog entry. Annotations connect this component to its tools:
#   GitHub repo + Actions runs, TechDocs (docs/), ECS service status (dev).
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | dump }}
  annotations:
    github.com/project-slug: 0019-KDU/${{ values.name }}
    backstage.io/techdocs-ref: dir:.
    # Costs tab: everything tagged component=<service> (ECS, ECR, logs, and linked databases)
    aws.amazon.com/cost-insights-tags: component=${{ values.name }}
    # ECS tab: the production service (blue/green, autoscaling)
    aws.amazon.com/amazon-ecs-service-arn: arn:aws:ecs:ap-south-1:697502032879:service/devops94-idp-prod-cluster/${{ values.name }}
  tags:
    - nodejs
    - aws-ecs
  links:
    - url: http://devops94-idp-dev-alb-754517378.ap-south-1.elb.amazonaws.com/${{ values.name }}/
      title: dev
      icon: web
    - url: http://devops94-idp-staging-alb-575975725.ap-south-1.elb.amazonaws.com/${{ values.name }}/
      title: staging
      icon: web
    - url: http://devops94-idp-prod-alb-793088738.ap-south-1.elb.amazonaws.com/${{ values.name }}/
      title: prod
      icon: web
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: idp-demo
