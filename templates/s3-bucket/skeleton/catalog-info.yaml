apiVersion: backstage.io/v1alpha1
kind: Resource
metadata:
  name: s3-${{ values.name }}
  title: ${{ values.name }} [${{ values.environment }}] (S3 bucket)
  description: ${{ values.description | dump }}
  annotations:
    aws.amazon.com/cost-insights-tags: resource=${{ values.name }},resource-type=s3-bucket,environment=${{ values.environment }}
  tags:
    - aws
    - s3
  links:
    - url: https://s3.console.aws.amazon.com/s3/buckets/devops94-idp-${{ values.environment }}-res-${{ values.name }}-697502032879?region=ap-south-1
      title: S3 console
      icon: cloud
    - url: https://github.com/0019-KDU/platform-resources/tree/main/resources/${{ values.type }}/${{ values.name }}
      title: Terraform definition
      icon: github
spec:
  type: s3-bucket
  owner: ${{ values.owner }}
  system: idp-demo
{%- if values.component %}
  dependencyOf:
    - ${{ values.component }}
{%- endif %}
