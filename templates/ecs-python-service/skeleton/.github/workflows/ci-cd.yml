# All the pipeline logic lives in the platform's reusable workflow (golden path).
# This file only says "I am ${{ values.name }}, use the standard pipeline".
name: CI/CD

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  id-token: write # needed so the reusable workflow can log in to AWS via OIDC

jobs:
  pipeline:
    uses: 0019-KDU/idp-platform/.github/workflows/ecs-service.yml@main
    with:
      service-name: ${{ values.name }}
      language: python
