# The whole pipeline lives in the platform's reusable workflow (golden path).
name: CI/CD

on:
  push:
    branches: [main]
  pull_request: {}

permissions:
  contents: read
  id-token: write

jobs:
  pipeline:
    uses: 0019-KDU/idp-platform/.github/workflows/ecs-service.yml@main
    with:
      service-name: ${{ values.name }}
      language: node
      test-command: npm run test:ci
      postgres: true
