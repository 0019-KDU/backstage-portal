# Backstage catalog entry. Annotations connect this service to its tools:
# GitHub (repo + Actions runs), TechDocs, Amazon ECS (prod service), Cost Insights.
apiVersion: backstage.io/v1alpha1
kind: Component
metadata:
  name: ${{ values.name }}
  description: ${{ values.description | dump }}
  annotations:
    github.com/project-slug: 0019-KDU/${{ values.name }}
    backstage.io/techdocs-ref: dir:.
    # Costs tab: everything tagged component=<name> in every environment (ECS, RDS, ECR, logs)
    aws.amazon.com/cost-insights-tags: component=${{ values.name }}
    # ECS tab: the production service (blue/green, autoscaling)
    aws.amazon.com/amazon-ecs-service-arn: arn:aws:ecs:ap-south-1:697502032879:service/devops94-idp-prod-cluster/${{ values.name }}
  tags:
    - typescript
    - nestjs
    - modular-monolith
    - aws-ecs
  links:
    - url: http://devops94-idp-dev-alb-754517378.ap-south-1.elb.amazonaws.com/${{ values.name }}/
      title: dev
      icon: web
    - url: http://devops94-idp-staging-alb-575975725.ap-south-1.elb.amazonaws.com/${{ values.name }}/
      title: staging
      icon: web
    - url: http://devops94-idp-prod-alb-793088738.ap-south-1.elb.amazonaws.com/${{ values.name }}/
      title: prod
      icon: web
    - url: https://ap-south-1.console.aws.amazon.com/ecs/v2/clusters/devops94-idp-prod-cluster/services/${{ values.name }}/deployments?region=ap-south-1
      title: Prod deployments (ECS console)
      icon: cloud
spec:
  type: service
  lifecycle: experimental
  owner: ${{ values.owner }}
  system: idp-demo
